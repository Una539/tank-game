[package]
name = "tank-server"
version = "0.1.0"
license = "AGPL-3.0-or-later"
edition = "2021"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# pround optional for fixed-point: not available on crates.io
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"
